[project]
name = "phulax-policy"
version = "0.0.1"
description = "Phulax policy engine — constrained rule schema, deterministic evaluation, signed bundles"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phulax_policy"]
